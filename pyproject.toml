[project]
name = "telegram-signal-k2"
version = "0.1.0"
description = "Telegram topic bot for Binance Futures KDJ signals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4.0",
  "matplotlib>=3.8,<4.0",
  "python-dotenv>=1.0,<2.0",
  "python-telegram-bot>=21.0,<23.0",
  # mexc_copy_bot only — asyncpg over an ORM to keep resident memory down on a 512MB worker
  # shared with the signal bot.
  "asyncpg>=0.29,<0.31",
  "cryptography>=42.0",
]

[project.scripts]
mexc-copy-bot = "mexc_copy_bot.__main__:main"
telegram-signal-k2 = "telegram_signal_k2.__main__:main"
telegram-signal-k2-healthcheck = "telegram_signal_k2.healthcheck:main"

[tool.ruff]
line-length = 100
target-version = "py311"

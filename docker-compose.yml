services:
  telegram-signal-k2:
    build: .
    container_name: telegram-signal-k2
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "telegram-signal-k2-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


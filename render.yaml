services:
  - type: worker
    name: telegram-signal-k2
    runtime: python
    buildCommand: pip install -e .
    # Both bots in one worker, as two separate processes (see scripts/run_both.sh for why).
    startCommand: bash scripts/run_both.sh
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_RUN_MODE
        value: polling
      - key: SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,HYPEUSDT
      - key: TIMEFRAMES
        # No 3h: Binance rejects it with "Invalid interval" (verified against the live API — 1h,
        # 2h and 4h all return 200, 3h returns 400). Leaving it in made every scan cycle log a
        # traceback per symbol for a timeframe that could never be fetched.
        value: 1m,3m,5m,15m,30m,1h,2h,4h
      - key: POLL_SECONDS
        value: "5"
      - key: STATE_FILE
        value: data/state.json
      - key: CHARTS_ENABLED
        value: "true"
      # ── MEXC copy bot (second process in this worker) ───────────────────────────────────
      - key: COPY_BOT_TOKEN
        sync: false
      - key: COPY_BOT_ALLOWED_USER_ID
        sync: false
      - key: COPY_BOT_DATABASE_URL
        sync: false
      - key: COPY_BOT_ENCRYPTION_KEY
        sync: false
